<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>시니어 펫 케어 MVP 목업</title>
<style>
:root{
  --offwhite:#F7F5F0; --ivory:#FBF8F1; --paper:#FFFFFF;
  --ink:#1B2B2A; --ink-soft:#5E6B69;
  --teal:#0F5E5C; --teal-deep:#0A4745; --teal-soft:#DCEEEC;
  --sage:#A9C0A6; --sage-soft:#E6EEE3;
  --peach:#F4B995; --peach-soft:#FCE8DB;
  --gray:#E4E5E3; --gray-ink:#7A817F;
  --font:"Noto Sans KR","Apple SD Gothic Neo",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:#222;color:var(--ink);display:flex;flex-direction:column;align-items:center;overflow:hidden;height:100vh;word-break:keep-all}
.viewport{flex:1;width:100%;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage{width:1920px;height:1080px;flex:none;position:relative;overflow:hidden;transform-origin:center center}
.scene{position:absolute;inset:0;display:none}
.scene.on{display:block}

/* ---------- common ---------- */
.headline{position:absolute;left:96px;top:72px;width:760px;z-index:20}
.headline h1{font-size:56px;line-height:1.22;font-weight:900;letter-spacing:-.03em;color:var(--ink)}
.headline h1 em{font-style:normal;color:var(--teal)}
.headline p{max-width:620px;margin-top:20px;font-size:28px;line-height:1.5;color:var(--ink-soft);font-weight:500}
.disc{position:absolute;left:96px;bottom:44px;font-size:20px;color:var(--ink-soft);z-index:20;font-weight:500}
.disc b{color:var(--teal)}

.phone{position:absolute;width:340px;height:700px;border-radius:52px;padding:12px;transform-style:preserve-3d}
.phone .bezel{position:absolute;inset:0;border-radius:52px}
.screen{position:relative;width:100%;height:100%;border-radius:40px;background:var(--offwhite);overflow:hidden;padding:44px 18px 18px;display:flex;flex-direction:column;gap:11px;font-size:14px;color:var(--ink)}
.screen::before{content:"";position:absolute;top:12px;left:50%;width:92px;height:22px;border-radius:12px;background:#15181A;transform:translateX(-50%)}
.step{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--teal)}
.screen h3{font-size:20px;font-weight:900;letter-spacing:-.02em;line-height:1.2}
.card{background:var(--paper);border-radius:18px;padding:12px 14px;border:1px solid #ECE9E1;display:flex;flex-direction:column;gap:7px}
.row{display:flex;align-items:center;gap:8px;font-weight:500}
.chk{width:20px;height:20px;border-radius:7px;background:var(--teal);color:#fff;font-size:13px;line-height:20px;text-align:center;font-weight:900;flex:none}
.chk.off{background:var(--gray);color:var(--gray-ink)}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--sage-soft);color:#3F5D3E}
.chip.peach{background:var(--peach-soft);color:#9A5326}
.badge{margin-left:auto;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--teal-soft);color:var(--teal-deep);white-space:nowrap}
.badge.un{background:var(--gray);color:var(--gray-ink)}
.btn{margin-top:auto;background:var(--teal);color:#fff;text-align:center;font-weight:700;font-size:15px;padding:13px;border-radius:16px}
.btn.ghost{background:var(--paper);color:var(--teal);border:1.5px solid var(--teal)}
.small{font-size:12px;color:var(--ink-soft);line-height:1.45;font-weight:500}
.tag-demo{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;padding:1px 7px;border-radius:6px;background:var(--peach-soft);color:#9A5326}
.who{display:flex;align-items:center;gap:8px;font-weight:700}
.av{width:30px;height:30px;border-radius:50%;background:var(--sage);flex:none}
.av.p{background:var(--peach)}
.amt{display:flex;justify-content:space-between;font-weight:500}
.total{display:flex;justify-content:space-between;align-items:baseline;font-weight:900;font-size:17px;border-top:1px dashed #D9D5CA;padding-top:8px}
.total span:last-child{color:var(--teal);font-size:20px}

/* ---------- Scene A : glass ---------- */
#sceneA{background:
  radial-gradient(900px 600px at 78% 18%,#fff 0,transparent 70%),
  radial-gradient(700px 500px at 20% 95%,#E9F0E7 0,transparent 70%),
  var(--offwhite)}
#sceneA .rig{position:absolute;left:0;top:150px;width:1920px;height:860px;perspective:2400px;perspective-origin:50% 40%}
#sceneA .phone{top:170px;background:#2A2D2F;box-shadow:0 60px 80px -30px rgba(20,40,40,.45),0 0 0 2px #4A4F52 inset}
#sceneA .phone .bezel{box-shadow:inset 0 0 0 3px rgba(255,255,255,.12),inset 0 2px 6px rgba(255,255,255,.25)}
#sceneA .pl{left:330px;transform:scale(.88) rotateY(32deg) rotateZ(-3deg) rotateX(6deg) translateZ(-60px)}
#sceneA .pc{left:790px;top:70px;transform:scale(1.2) translateZ(60px);z-index:5}
#sceneA .pr{left:1250px;transform:scale(.88) rotateY(-32deg) rotateZ(3deg) rotateX(6deg) translateZ(-60px)}
.glass{position:absolute;z-index:12;padding:16px 22px;border-radius:24px;background:rgba(255,255,255,.42);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);border:1.5px solid rgba(255,255,255,.8);box-shadow:0 24px 50px -20px rgba(15,94,92,.35);font-size:20px;font-weight:700;color:var(--ink)}
.glass small{display:block;font-size:14px;font-weight:700;letter-spacing:.1em;color:var(--teal);margin-bottom:6px}
.glass ul{list-style:none;display:flex;flex-direction:column;gap:5px;font-weight:500;font-size:19px}
.glass li::before{content:"✓ ";color:var(--teal);font-weight:900}
.glass li.un::before{content:"– ";color:var(--gray-ink)}
.glass li.un{color:var(--gray-ink)}
.g1{left:130px;top:640px}
.g2{left:1580px;top:560px}
.g3{left:1590px;top:900px}
.g3 .big{font-size:36px;font-weight:900;color:var(--teal);letter-spacing:-.02em}
.pets{position:absolute;right:96px;top:70px;display:flex;gap:22px;z-index:13}
.pets svg{width:150px;height:150px;filter:drop-shadow(0 14px 14px rgba(40,60,50,.22))}


#sceneA .phone{cursor:default}
.hint{position:absolute;right:96px;top:245px;font-size:20px;font-weight:700;color:var(--teal);z-index:20;background:rgba(255,255,255,.75);border:1.5px solid var(--teal);border-radius:999px;padding:8px 18px;pointer-events:none}
.screen{overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen::before{z-index:3}
.phone button.btn{border:0;font:inherit;font-weight:700;font-size:15px;cursor:pointer;width:100%;flex:none}
.phone button.btn.ghost{border:1.5px solid var(--teal)}
.phone button.btn:active{transform:scale(.98)}
.phone button.btn[disabled]{background:var(--gray);color:var(--gray-ink);cursor:not-allowed;border:0}
.back{align-self:flex-start;font:inherit;font-size:13px;font-weight:700;color:var(--teal);background:none;border:0;cursor:pointer;padding:0;flex:none}
.tg{cursor:pointer;user-select:none}
.tg.off .chk{background:var(--gray);color:transparent}
.chip{cursor:pointer;border:0;font-family:inherit}
.chip.off{background:var(--gray);color:var(--gray-ink)}
.warn{background:var(--peach-soft);color:#7A3F17;border-radius:14px;padding:9px 12px;font-size:12.5px;line-height:1.45;font-weight:500}
.ok{background:var(--teal-soft);color:var(--teal-deep);border-radius:14px;padding:9px 12px;font-size:12.5px;line-height:1.45;font-weight:500}
.vbtn{font:inherit;font-size:12px;font-weight:700;color:var(--teal);background:var(--paper);border:1.5px solid var(--teal);border-radius:999px;padding:3px 10px;cursor:pointer}
.vbtn[disabled]{color:var(--gray-ink);border-color:var(--gray);cursor:default}
.tl{display:flex;flex-direction:column;padding:4px 2px}
.tl .t{display:flex;gap:12px;align-items:flex-start;padding-bottom:12px;position:relative;font-weight:700;font-size:13.5px}
.tl .t::before{content:"";position:absolute;left:10px;top:22px;bottom:0;width:2px;background:#E6E3DB}
.tl .t:last-child::before{display:none}
.tl .dot{width:22px;height:22px;border-radius:50%;background:var(--teal);color:#fff;font-size:12px;line-height:22px;text-align:center;flex:none}
.tl .t.todo{color:var(--gray-ink);font-weight:500}
.tl .t.todo .dot{background:var(--gray);color:var(--gray-ink)}
.tl .t.now .dot{background:var(--peach);color:#3A2012;box-shadow:0 0 0 4px var(--peach-soft)}
.tl .t small{display:block;font-weight:500;color:var(--ink-soft);font-size:11.5px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(244,185,149,.95),0 60px 80px -30px rgba(20,40,40,.45)}100%{box-shadow:0 0 0 26px rgba(244,185,149,0),0 60px 80px -30px rgba(20,40,40,.45)}}
#sceneA .phone.pulse{animation:pulse .9s ease-out}
</style>
</head>
<body>
<div class="viewport" id="vp"><div class="stage" id="stage">
<div class="scene on" id="sceneA">
  <div class="headline">
    <h1>우리 아이 케어,<br><em>해 본 사람만</em> 보여 드려요.</h1>
    <p>필요한 돌봄부터 확인하고, 총액과 케어 계획까지 함께 정해요.</p>
  </div>
  <div class="pets" aria-hidden="true">
    <svg viewBox="0 0 150 150"><use href="#dog"/></svg>
    <svg viewBox="0 0 150 150"><use href="#cat"/></svg>
  </div>
  <div class="hint">폰 안의 버튼을 직접 눌러 보세요</div>
  <div class="glass g1"><small>REQUIRED TASKS</small><ul id="g1"></ul></div>
  <div class="glass g2"><small>EVIDENCE BY TASK</small><ul id="g2"></ul></div>
  <div class="glass g3"><small>TOTAL QUOTE · DEMO</small><div class="big">KRW 140,000</div></div>
  <div class="rig">
    <div class="phone pl" id="ph1"><div class="bezel"></div><div class="screen" id="s1"></div></div>
    <div class="phone pc" id="ph2"><div class="bezel"></div><div class="screen" id="s2"></div></div>
    <div class="phone pr" id="ph3"><div class="bezel"></div><div class="screen" id="s3"></div></div>
  </div>
  <div class="disc"><b>콘셉트 목업</b> · 인물·프로필·가격은 시연용 예시 · 방문형 서비스이며 방문 사이 상주하지 않습니다</div>
</div>
</div></div>

<!-- pet figures (shared) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="dog">
      <ellipse cx="75" cy="128" rx="46" ry="12" fill="rgba(60,50,40,.12)"/>
      <ellipse cx="38" cy="62" rx="16" ry="30" fill="#B58F6B" transform="rotate(18 38 62)"/>
      <ellipse cx="112" cy="62" rx="16" ry="30" fill="#B58F6B" transform="rotate(-18 112 62)"/>
      <circle cx="75" cy="70" r="42" fill="#D9B48C"/>
      <ellipse cx="75" cy="88" rx="24" ry="19" fill="#F3E3CF"/>
      <ellipse cx="75" cy="80" rx="8" ry="6" fill="#3A302A"/>
      <circle cx="58" cy="64" r="4.5" fill="#3A302A"/><circle cx="92" cy="64" r="4.5" fill="#3A302A"/>
      <path d="M67 94q8 7 16 0" stroke="#3A302A" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="75" cy="38" rx="20" ry="9" fill="#E8E2DA" opacity=".85"/>
    </g>
    <g id="cat">
      <ellipse cx="75" cy="128" rx="46" ry="12" fill="rgba(60,50,40,.12)"/>
      <path d="M36 52 40 14 66 36z" fill="#9FA3A8"/><path d="M114 52 110 14 84 36z" fill="#9FA3A8"/>
      <path d="M42 44 44 26 56 36z" fill="#F4B995"/><path d="M108 44 106 26 94 36z" fill="#F4B995"/>
      <ellipse cx="75" cy="72" rx="44" ry="40" fill="#B9BDC2"/>
      <ellipse cx="75" cy="88" rx="22" ry="16" fill="#EDEEF0"/>
      <path d="M69 80h12l-6 7z" fill="#F4B995"/>
      <path d="M58 62q5 -5 10 0M82 62q5 -5 10 0" stroke="#3A3F44" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M67 92q8 6 16 0" stroke="#3A3F44" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M40 80h-18M40 88l-16 6M110 80h18M110 88l16 6" stroke="#8B9096" stroke-width="2" stroke-linecap="round"/>
    </g>
  </defs>
</svg>

<script>
const stage=document.getElementById('stage'),vp=document.getElementById('vp');
function fit(){const s=Math.min(vp.clientWidth/1920,vp.clientHeight/1080);stage.style.transform='scale('+s+')';stage.style.margin=(-(1080*(1-s))/2)+'px '+(-(1920*(1-s))/2)+'px'}
addEventListener('resize',fit);fit();

/* 상태: 버튼은 화면 이동·표시만 바꾸고, 실제 기능은 없음 */
const P={tasks:{feed:true,toilet:true,mob:true,med:false},win:{m:true,e:true},submitted:false,cand:"A",v2:"list",v3:"quote",verify:{}};
const CAND={A:{n:"Caregiver A",t:"Mon 08–10 · Wed 18–20",ev:{feed:true,toilet:true,mob:false},sum:"Feeding and toileting records confirmed (demo data)."},
            B:{n:"Caregiver B",t:"Tue 08–10 · Thu 18–20",ev:{feed:true,toilet:false,mob:true},sum:"Feeding and mobility records confirmed (demo data)."}};
const TN={feed:"Feeding assistance",toilet:"Toileting cleanup",mob:"Mobility assistance"};
const SH={feed:"Feeding",toilet:"Toileting",mob:"Mobility"};
const $=id=>document.getElementById(id);
const req=()=>["feed","toilet","mob"].filter(k=>P.tasks[k]);
const ev=(c,k)=>CAND[c].ev[k]||P.verify[c+k]==="done";
const missing=c=>req().filter(k=>!ev(c,k));
const bdg=(c,k)=>ev(c,k)?'<span class="badge">Confirmed</span>':(P.verify[c+k]==="req"?'<span class="badge un">Requested</span>':'<span class="badge un">Not confirmed</span>');

function s1(){return `<div class="step">01 · CARE REQUEST</div><h3>Required care</h3>
  <div class="card"><div class="who"><span class="av p"></span>Bori · Senior dog · 13 yrs <span class="tag-demo">DEMO</span></div><div class="small">Home visit · Away 3 days</div></div>
  <div class="card">${["feed","toilet","mob"].map(k=>`<div class="row tg ${P.tasks[k]?"":"off"}" data-a="task" data-k="${k}"><span class="chk">✓</span>${TN[k]}</div>`).join("")}
   <div class="row tg ${P.tasks.med?"":"off"}" data-a="task" data-k="med"><span class="chk ${P.tasks.med?"off":""}">${P.tasks.med?"!":"✓"}</span>Medication request<span class="badge un">Operator review</span></div></div>
  <div class="card"><div class="small">Preferred visit windows</div><div><button class="chip ${P.win.m?"":"off"}" data-a="win" data-k="m">Morning 08–10</button> <button class="chip ${P.win.e?"":"off"}" data-a="win" data-k="e">Evening 18–20</button></div></div>
  <button class="btn" data-a="submit"${req().length?"":" disabled"}>${P.submitted?"Submitted ✓ · see candidates":"Submit required care"}</button>`}
function candCard(c){const d=CAND[c];return `<div class="card"><div class="who"><span class="av ${c==="B"?"p":""}"></span>${d.n} <span class="tag-demo">DEMO</span></div>
  ${req().map(k=>`<div class="row">${SH[k]}${bdg(c,k)}</div>`).join("")||'<div class="small">No required tasks selected.</div>'}
  <div class="small">Available: ${d.t}</div>
  <button class="btn ghost" data-a="detail" data-c="${c}" style="margin-top:4px;padding:9px">View details</button></div>`}
function s2(){
  if(P.v2==="list")return `<div class="step">02 · CANDIDATES</div><h3>Task-by-task evidence</h3>${candCard("A")}${candCard("B")}<div class="small">No overall badge or score. Each task shows its own evidence status.</div>`;
  const c=P.cand,d=CAND[c];return `<button class="back" data-a="list">‹ Candidates</button><div class="step">02 · CANDIDATE DETAIL</div>
  <div class="who" style="font-size:18px"><span class="av ${c==="B"?"p":""}" style="width:34px;height:34px"></span>${d.n} <span class="tag-demo">DEMO</span></div>
  <div class="card">${req().map(k=>`<div class="row">${TN[k]}${bdg(c,k)}</div>${ev(c,k)?"":`<div class="small">Must be checked before confirmation. <button class="vbtn" data-a="verify" data-k="${k}"${P.verify[c+k]?" disabled":""}>${P.verify[c+k]?"Verification requested":"Ask to verify"}</button></div>`}`).join("")}</div>
  <div class="card"><div class="small">Evidence summary</div><div>${d.sum}</div><div class="small">Available: ${d.t}</div></div>
  ${missing(c).length?`<div class="warn">Unconfirmed: ${missing(c).map(k=>TN[k]).join(", ")}. This caregiver cannot be finalized until checked.</div>`:`<div class="ok">All requested tasks have confirmed evidence.</div>`}
  <button class="btn" data-a="quote">See sample quote</button>`}
function s3(){const c=P.cand,m=missing(c);
  if(P.v3==="quote")return `<div class="step">03 · QUOTE &amp; PLAN</div><h3>Sample quote <span class="tag-demo">DEMO</span></h3>
  <div class="card"><div class="small">${CAND[c].n} · 3 days · 9 visits · 40 min per visit</div>
   <div class="amt"><span>Care visits (9)</span><span>108,000</span></div><div class="amt"><span>Service fee</span><span>20,000</span></div><div class="amt"><span>Travel add-on</span><span>12,000</span></div>
   <div class="total"><span>Total (KRW)</span><span>140,000</span></div></div>
  <div class="card">${req().map(k=>`<div class="row"><span class="chk${ev(c,k)?"":" off"}">${ev(c,k)?"✓":"!"}</span>${TN[k]}</div>`).join("")}<div class="row"><span class="chk off">–</span>No overnight presence</div></div>
  ${m.length?`<div class="warn">Not yet confirmed: ${m.map(k=>SH[k]).join(", ")}. Final confirmation stays locked.</div>`:`<div class="small">Draft plan · Not confirmed until both parties agree after the pre-meeting.</div>`}
  <button class="btn" data-a="premeet">Request pre-meeting</button>`;
  return `<button class="back" data-a="toquote">‹ Quote</button><div class="step">04 · PRE-MEETING</div><h3>Pre-meeting requested</h3>
  <div class="ok">Request sent to ${CAND[c].n} (demo). The plan is not final until both parties agree after the pre-meeting.</div>
  <div class="card tl">
   <div class="t"><span class="dot">✓</span><div>Request<small>Required care submitted</small></div></div>
   <div class="t"><span class="dot">✓</span><div>Candidate check<small>${CAND[c].n} selected</small></div></div>
   <div class="t"><span class="dot">✓</span><div>One-page quote<small>KRW 140,000 · demo</small></div></div>
   <div class="t now"><span class="dot">4</span><div>Pre-meeting<small>Waiting for schedule</small></div></div>
   <div class="t todo"><span class="dot">5</span><div>Both parties confirm<small>${m.length?"Locked · unconfirmed task remains":"Not confirmed"}</small></div></div>
   <div class="t todo"><span class="dot">6</span><div>Visit log</div></div></div>
  <button class="btn ghost" data-a="reset">Start over</button>`}
function draw(){
  [[1,s1],[2,s2],[3,s3]].forEach(([n,f])=>{const el=$("s"+n),y=el.scrollTop;el.innerHTML=f();el.scrollTop=y});
  $("g1").innerHTML=req().map(k=>`<li>${SH[k]}</li>`).join("")||'<li class="un">None selected</li>';
  $("g2").innerHTML=req().map(k=>`<li class="${ev(P.cand,k)?"":"un"}">${SH[k]} · ${ev(P.cand,k)?"Confirmed":"Not confirmed"}</li>`).join("")||'<li class="un">–</li>';
}
function pulse(n){const p=$("ph"+n);p.classList.remove("pulse");void p.offsetWidth;p.classList.add("pulse")}
stage.addEventListener("click",e=>{
  const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a;
  if(a==="task")P.tasks[t.dataset.k]=!P.tasks[t.dataset.k];
  else if(a==="win")P.win[t.dataset.k]=!P.win[t.dataset.k];
  else if(a==="submit"){P.submitted=true;P.v2="list";pulse(2)}
  else if(a==="detail"){P.cand=t.dataset.c;P.v2="detail";P.v3="quote"}
  else if(a==="list")P.v2="list";
  else if(a==="verify")P.verify[P.cand+t.dataset.k]="req";
  else if(a==="quote"){P.v3="quote";pulse(3)}
  else if(a==="premeet")P.v3="meet";
  else if(a==="toquote")P.v3="quote";
  else if(a==="reset"){P.submitted=false;P.v2="list";P.v3="quote";P.cand="A";P.verify={};P.tasks={feed:true,toilet:true,mob:true,med:false};P.win={m:true,e:true}}
  draw();
});
draw();
</script>
</body>
</html>
